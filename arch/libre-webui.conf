# Libre WebUI service environment. Read by the systemd unit.
# Uncomment and adjust as needed; restart with: systemctl restart libre-webui

# Port the web interface listens on.
#PORT=8080

# Ollama endpoint for local models (optional; cloud providers work without it).
#OLLAMA_BASE_URL=http://127.0.0.1:11434

# Secret used to sign login sessions. Generate with: openssl rand -hex 32
# When unset, a random secret is generated at startup (sessions reset on restart).
#JWT_SECRET=
